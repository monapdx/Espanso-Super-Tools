matches:
  - trigger: ":mycolor"
    label: "Add or update a personal color"
    replace: "{{output}}"
    vars:
      - name: color
        type: form
        params:
          layout: |
            Create a personal color trigger
            Name (e.g. brandpink): [[name]]
            Hex code (e.g. #e69dfc): [[hex]]
            Action: [[action]]
          fields:
            action:
              type: choice
              default: "Save to my colors"
              values:
                - "Save to my colors"
                - "Generate YAML only"
      - name: output
        type: script
        depends_on: [color]
        params:
          args:
            - python
            - "%CONFIG%/scripts/mycolor.py"

