# Obsidian note templates and Windows plain-JavaScript plugin starter.
# Copy into your Espanso match folder; no helper installation required.
matches:
- trigger: :idea
  replace: |
    ---
    title:
    category:
    medium:
    thesis:
    date: {{idea_date}}
    ---
  vars:
  - name: idea_date
    type: date
    params:
      format: '%Y-%m-%d'
- trigger: :project
  replace: |
    ---
    title:
    type:
    problem:
    solution:
    date: {{project_date}}
    ---
  vars:
  - name: project_date
    type: date
    params:
      format: '%Y-%m-%d'
- trigger: :plugin
  word: true
  replace: '{{create_plugin}}'
  vars:
  - name: plugin_form
    type: form
    params:
      layout: |-
        New Obsidian plugin

        Plugin name: [[name]]

        Plugin ID (blank = derive from name): [[id]]

        Version: [[version]]

        Author: [[author]]

        Description: [[description]]

        Minimum supported Obsidian version: [[minimum]]

        Desktop only? [[desktop]]

        Author website (optional): [[website]]

        Funding URL (optional): [[funding]]

        Existing parent folder (creates a plugin-ID subfolder):

        [[parent]]
      fields:
        name: {}
        id: {}
        version:
          default: 1.0.0
        author: {}
        description:
          multiline: true
        minimum:
          default: 1.0.0
        desktop:
          type: choice
          values:
          - 'Yes'
          - 'No'
          default: 'Yes'
        website: {}
        funding: {}
        parent: {}
  - name: create_plugin
    type: shell
    depends_on:
    - plugin_form
    params:
      shell: powershell
      cmd: |
        $request = @{
          name = $env:ESPANSO_PLUGIN_FORM_NAME
          id = $env:ESPANSO_PLUGIN_FORM_ID
          version = $env:ESPANSO_PLUGIN_FORM_VERSION
          author = $env:ESPANSO_PLUGIN_FORM_AUTHOR
          description = $env:ESPANSO_PLUGIN_FORM_DESCRIPTION
          minimum = $env:ESPANSO_PLUGIN_FORM_MINIMUM
          desktop = $env:ESPANSO_PLUGIN_FORM_DESKTOP
          website = $env:ESPANSO_PLUGIN_FORM_WEBSITE
          funding = $env:ESPANSO_PLUGIN_FORM_FUNDING
          parent = $env:ESPANSO_PLUGIN_FORM_PARENT
        } | ConvertTo-Json -Compress
        $request64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($request))
        $worker = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
        $worker = $worker.Replace('__REQUEST__', $request64)
        $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($worker))
        Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile', '-STA', '-EncodedCommand', $encoded) | Out-Null
