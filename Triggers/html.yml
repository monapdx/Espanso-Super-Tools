  - trigger: ":link"
    word: true
    replace: "<link rel=\"stylesheet\" href=\"$|$\">"
  - trigger: ":meta"
    word: true
    replace: "<meta name=\"$|$\" content=\"\">"
  - trigger: ":source"
    word: true
    replace: "<source src=\"$|$\" type=\"\">"
  - trigger: ":track"
    word: true
    replace: "<track src=\"$|$\" kind=\"subtitles\" srclang=\"en\" label=\"English\">"
  - trigger: ":wbr"
    word: true
    replace: "<wbr>"

  # Additional common elements
  - trigger: ":textarea"
    word: true
    replace: "<textarea id=\"\" name=\"\" rows=\"4\" cols=\"40\">$|$</textarea>"
  - trigger: ":video"
