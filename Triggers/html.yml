# HTML snippets for Espanso 2.x
# Install in %APPDATA%\espanso\match\html.yml
# Type :tag then Space. $|$ marks the cursor position.
matches:

  # Document and block elements
  - trigger: ":html"
    word: true
    replace: "<html>$|$</html>"
  - trigger: ":head"
    word: true
    replace: "<head>$|$</head>"
  - trigger: ":body"
    word: true
    replace: "<body>$|$</body>"
