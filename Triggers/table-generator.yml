# Espanso table template (Windows / PowerShell).
# Save in Espanso's match folder and type :mdtable.
# Edit the dropdown options and field labels below to customize.
# Outputs Markdown and HTML source; does not send anything.

matches:
- trigger: :mdtable
  force_mode: clipboard
  replace: "{{table_markdown}}"
  vars:
  - name: table_form
    type: form
    params:
      layout: |-
        Selection 1: [[selection_one]]
        Selection 2: [[selection_two]]
        Title: [[title]]

        Content:
        [[content]]
      fields:
        selection_one:
          type: choice
          default: Option 1
          values:
          - Option 1
          - Option 2
          - Option 3
        selection_two:
          type: choice
          default: Option 2
          values:
          - Option 1
          - Option 2
          - Option 3
        title:
          default: Example title
          multiline: false
        content:
          default: |-
            Enter your content here.

            Multiple lines are supported.
          multiline: true
  - name: table_html
    type: shell
    depends_on:
    - table_form
    params:
      shell: powershell
      cmd: |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)

        $values = @{
          '@@SELECTION_ONE@@' = [System.Net.WebUtility]::HtmlEncode($env:ESPANSO_TABLE_FORM_SELECTION_ONE)
          '@@SELECTION_TWO@@' = [System.Net.WebUtility]::HtmlEncode($env:ESPANSO_TABLE_FORM_SELECTION_TWO)
          '@@TITLE@@' = [System.Net.WebUtility]::HtmlEncode($env:ESPANSO_TABLE_FORM_TITLE)
          '@@CONTENT@@' = [System.Net.WebUtility]::HtmlEncode($env:ESPANSO_TABLE_FORM_CONTENT)
        }

        $template = @'
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>@@TITLE@@</title>
          <style>
            :root {
              --pink: #ff20d4;
              --lime: #16ff00;
              --violet: #8c00ff;
              --black: #050505;
            }
            * { box-sizing: border-box; }
            html { background: #f1f1f1; }
            body {
              max-width: 980px;
              min-height: 100vh;
              margin: 0 auto;
              padding: 64px 72px 120px;
              background: #fff;
              color: #080808;
              font-family: Arial, Helvetica, sans-serif;
              font-size: 16px;
              line-height: 1.55;
            }
            h1, h2, h3, h4 { color: #000; font-weight: 800; line-height: 1.2; }
            h3 { margin: 2.15rem 0 0.6rem; font-size: 1.24rem; }
            p { margin: 0.7rem 0 1rem; }
            a { color: #111; text-decoration-thickness: 2px; }
            ul { padding-left: 1.5rem; }
            .contains-task-list { padding-left: 0; }
            .task-list-item { list-style: none; }
            .task-list-item input {
              width: 1rem; height: 1rem; margin-right: 0.45rem;
              accent-color: var(--pink);
            }
            table {
              width: auto; max-width: 100%; margin: 2.1rem 0 1.25rem;
              border-collapse: collapse; border: 4px solid var(--black); background: #fff;
            }
            th, td {
              padding: 6px 10px; border: 3px solid var(--black);
              vertical-align: top; text-align: left;
            }
            thead th { background: var(--pink); color: #000; font-weight: 800; }
            tbody td:first-child { background: #f0f0f0; font-weight: 800; white-space: nowrap; }
            code {
              padding: 0.08em 0.27em; background: var(--black); color: var(--lime);
              font-family: Consolas, "Cascadia Code", monospace;
              font-size: 0.88em; font-weight: 700;
            }
            pre {
              overflow-x: auto; margin: 1.25rem 0 1rem; padding: 22px 20px;
              border-left: 5px solid var(--pink); border-right: 5px solid var(--violet);
              border-radius: 4px; background: #030303; color: var(--lime); line-height: 1.45;
            }
            pre code {
              padding: 0; background: transparent; color: inherit;
              font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere;
            }
            img {
              display: block; max-width: 100%; height: auto;
              margin: 1rem 0 1.25rem; border: 3px solid #000;
            }
            blockquote {
              margin: 1.25rem 0; padding: 0.8rem 1rem;
              border-left: 5px solid var(--violet); background: #f3f3f3;
            }
            hr { height: 4px; border: 0; background: var(--black); }
            @media (max-width: 760px) {
              body { padding: 34px 22px 72px; }
              table { width: 100%; font-size: 0.88rem; }
              th, td { padding: 5px 7px; }
              tbody td:first-child { white-space: normal; }
            }
            @media print {
              html, body { background: #fff; }
              body { max-width: none; padding: 0.5in; }
              pre, table, img { break-inside: avoid; }
            }
          </style>
        </head>
        <body>
          <h3>@@TITLE@@</h3>
          <table>
            <thead><tr><th scope="col">Field</th><th scope="col">Value</th></tr></thead>
            <tbody>
              <tr><td><strong>Selection 1:</strong></td><td>@@SELECTION_ONE@@</td></tr>
              <tr><td><strong>Selection 2:</strong></td><td>@@SELECTION_TWO@@</td></tr>
              <tr><td><strong>Title:</strong></td><td>@@TITLE@@</td></tr>
            </tbody>
          </table>
          <pre><code class="language-text">@@CONTENT@@</code></pre>
        </body>
        </html>
        '@

        # Replace only original template tokens, never tokens inside user content.
        $html = [regex]::Replace(
          $template,
          '@@(SELECTION_ONE|SELECTION_TWO|TITLE|CONTENT)@@',
          [System.Text.RegularExpressions.MatchEvaluator]{
            param($token)
            $values[$token.Value]
          }
        )
        [Console]::Write($html)

  - name: table_markdown
    type: shell
    depends_on:
    - table_form
    - table_html
    params:
      shell: powershell
      cmd: |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
        function Escape-Cell([string]$value) {
          return [System.Net.WebUtility]::HtmlEncode($value).Replace('|', '&#124;').Replace("`r`n", '<br>').Replace("`n", '<br>').Replace("`r", '<br>')
        }
        function Fence-Block([string]$value, [string]$language) {
          $length = 3
          foreach ($run in [regex]::Matches($value, '~+')) {
            $length = [Math]::Max($length, $run.Length + 1)
          }
          $fence = '~' * $length
          return $fence + $language + "`n" + $value + "`n" + $fence
        }
        $one = Escape-Cell $env:ESPANSO_TABLE_FORM_SELECTION_ONE
        $two = Escape-Cell $env:ESPANSO_TABLE_FORM_SELECTION_TWO
        $title = Escape-Cell $env:ESPANSO_TABLE_FORM_TITLE
        $content = Fence-Block $env:ESPANSO_TABLE_FORM_CONTENT 'text'
        $html = Fence-Block $env:ESPANSO_TABLE_HTML 'html'
        $output = @(
          '## Markdown version', '',
          '| Field | Value |', '| --- | --- |',
          "| **Selection 1:** | $one |",
          "| **Selection 2:** | $two |",
          "| **Title:** | $title |", '',
          $content, '', '## HTML version', '', $html
        ) -join "`n"
        [Console]::Write($output)
